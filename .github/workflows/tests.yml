name: tests

on:
  push:
    branches: [main, master, gymnasium, cleanup-2026]
  pull_request:
    branches: [main, master, gymnasium, cleanup-2026]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = ROS Noetic's bundled Python (the supported runtime).
        # 3.10 = forward-compat check.
        # 3.12 is blocked on migrating setup.py from distutils to
        # setuptools (distutils was removed from 3.12 stdlib).
        python-version: ["3.8", "3.10"]

    steps:
      - name: Check out multiros
        uses: actions/checkout@v4
        with:
          path: multiros

      # multiros's proxy class + shared utilities live in UniROS after
      # Round 8.1 / 8.2. We need UniROS importable for tests to run.
      - name: Check out UniROS
        uses: actions/checkout@v4
        with:
          repository: ncbdrck/UniROS
          path: UniROS

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # catkin_pkg is needed because setup.py uses generate_distutils_setup.
          # No ROS install — tests stub the rospy ecosystem.
          pip install catkin_pkg pytest
          pip install gymnasium gymnasium_robotics numpy
          # Install UniROS first (multiros depends on it)
          pip install -e UniROS/uniros
          pip install -e multiros

      - name: Run pytest
        working-directory: multiros
        run: pytest tests/ -v
