name: tests

on:
  push:
    branches: [main, master, gymnasium, cleanup-2026, tier2-2026]
  pull_request:
    branches: [main, master, gymnasium, cleanup-2026, tier2-2026]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = ROS Noetic's bundled Python (the supported runtime).
        # 3.10 = forward-compat check.
        # 3.12 = forward-compat check (Tier-2: setup.py migrated from
        # distutils to setuptools so this now works).
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - name: Check out multiros
        uses: actions/checkout@v4
        with:
          path: multiros

      # multiros's proxy class + shared utilities live in UniROS. Clone the
      # branch matching whatever branch this workflow is running on, so a PR
      # or push on multiros's cleanup-2026 pulls UniROS's cleanup-2026, etc.
      # Falls back to UniROS's default branch if there's no match.
      #
      # IMPORTANT: when fast-forwarding cleanup-2026 → gymnasium across the
      # ecosystem, merge UniROS *first* and the dependent repos after. If a
      # dependent repo (multiros, realros) is pushed before UniROS, its CI
      # will check out the *old* UniROS gymnasium tip (missing the new
      # uniros._proxy and uniros.utils packages) and fail to import them.
      - name: Check out UniROS
        uses: actions/checkout@v4
        with:
          repository: ncbdrck/UniROS
          ref: ${{ github.head_ref || github.ref_name }}
          path: UniROS

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # setup.py imports catkin_pkg + uses distutils. Install build deps in
          # the OUTER env, then pass --no-build-isolation to pip install so the
          # build subprocess can see them. Without this, pip creates a clean
          # build sandbox and catkin_pkg is invisible there.
          pip install setuptools wheel catkin_pkg pytest
          # Pin gymnasium to match the supported runtime.
          pip install "gymnasium==0.29.1" "gymnasium_robotics==1.2.4" numpy
          # Install UniROS first (multiros depends on it).
          pip install -e UniROS/uniros --no-build-isolation
          pip install -e multiros --no-build-isolation

      - name: Run pytest
        working-directory: multiros
        run: pytest tests/ -v
