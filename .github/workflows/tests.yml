name: tests

on:
  push:
    branches: [main, master, gymnasium, tier2-2026]
  pull_request:
    branches: [main, master, gymnasium, tier2-2026]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = ROS Noetic's bundled Python (the only runtime where
        # the framework actually works against real rospy / Gazebo).
        # 3.10 = forward-compat smoke test for the day the framework
        # ports to ROS 2 (the test suite stubs rospy so it can run on
        # newer Pythons even though real-world use is 3.8-only).
        python-version: ["3.8", "3.10"]

    steps:
      - name: Check out multiros
        uses: actions/checkout@v4
        with:
          path: multiros

      # multiros's proxy class + shared utilities live in UniROS. Clone the
      # branch matching whatever branch this workflow is running on, so a PR
      # or push on a feature branch pulls UniROS's matching branch, with
      # UniROS's default branch as the fallback when no match exists.
      #
      # IMPORTANT: when fast-forwarding an integration branch → gymnasium
      # across the ecosystem, merge UniROS *first* and the dependent repos
      # after. If a dependent repo (multiros, realros) is pushed before
      # UniROS, its CI checks out the *old* UniROS gymnasium tip (missing
      # the new uniros._proxy / uniros.utils packages) and fails to import.
      - name: Check out UniROS
        uses: actions/checkout@v4
        with:
          repository: ncbdrck/UniROS
          ref: ${{ github.head_ref || github.ref_name }}
          path: UniROS

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # setup.py imports catkin_pkg + uses distutils. Install build deps in
          # the OUTER env, then pass --no-build-isolation to pip install so the
          # build subprocess can see them. Without this, pip creates a clean
          # build sandbox and catkin_pkg is invisible there.
          pip install setuptools wheel catkin_pkg pytest
          # Pin gymnasium to match the supported runtime.
          pip install "gymnasium==0.29.1" "gymnasium_robotics==1.2.4" numpy
          # Install UniROS first (multiros depends on it).
          pip install -e UniROS/uniros --no-build-isolation
          pip install -e multiros --no-build-isolation

      - name: Run pytest
        working-directory: multiros
        run: pytest tests/ -v
